[package]
name = "llama-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Fissata il 10-11: il repo non tiene Cargo.lock, e la 0.1.161 ha cambiato i
# nomi (via `AddBos`, `str_to_token`, `token_to_piece_bytes`): la build moriva
# qui prima ancora dell'app. La 0.1.157 e' quella dell'ultima build riuscita
# (30-09). La parte in C si fissa con lei, perche' non si separino.
llama-cpp-2 = "=0.1.157"
llama-cpp-sys-2 = "=0.1.157"
encoding_rs = "0.8"

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]


# Release profile lives at the workspace root (Cargo only honors profiles
# from the root manifest). See top-level Cargo.toml.
